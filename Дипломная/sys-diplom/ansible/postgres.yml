---
- name: Configure PostgreSQL common settings
  hosts: postgres
  become: true

  vars:
    postgresql_version: "16"
    postgresql_conf_dir: "/etc/postgresql/16/main"
    postgresql_data_dir: "/var/lib/postgresql/16/main"

  tasks:
    - name: Install PostgreSQL and Python adapter
      ansible.builtin.apt:
        name:
          - postgresql-16
          - postgresql-client-16
          - python3-psycopg2
        state: present
        update_cache: true

    - name: Deploy common PostgreSQL configuration
      ansible.builtin.copy:
        dest: "{{ postgresql_conf_dir }}/conf.d/diploma.conf"
        owner: postgres
        group: postgres
        mode: "0644"
        content: |
          listen_addresses = '*'
          wal_level = replica
          max_wal_senders = 10
          max_replication_slots = 10
          hot_standby = on
      notify: Restart PostgreSQL

    - name: Allow application connections from web-01
      community.postgresql.postgresql_pg_hba:
        dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
        contype: host
        databases: phr
        users: phr
        source: 10.10.20.12/32
        method: scram-sha-256
      notify: Reload PostgreSQL

    - name: Allow application connections from web-02
      community.postgresql.postgresql_pg_hba:
        dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
        contype: host
        databases: phr
        users: phr
        source: 10.10.30.24/32
        method: scram-sha-256
      notify: Reload PostgreSQL

    - name: Ensure PostgreSQL is enabled and running
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Apply PostgreSQL configuration changes
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

    - name: Reload PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: reloaded

- name: Configure PostgreSQL primary
  hosts: db_primary
  become: true

  vars:
    ansible_ssh_pipelining: true
    postgresql_conf_dir: "/etc/postgresql/16/main"

  tasks:
    - name: Allow replication connection from standby
      community.postgresql.postgresql_pg_hba:
        dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
        contype: host
        databases: replication
        users: replicator
        source: 10.10.20.4/32
        method: scram-sha-256
      notify: Reload PostgreSQL

    - name: Ensure application role exists
      community.postgresql.postgresql_user:
        name: phr
        password: "{{ postgres_app_password }}"
        role_attr_flags: LOGIN
        state: present
        no_password_changes: true
      become_user: postgres
      no_log: true

    - name: Ensure application database exists
      community.postgresql.postgresql_db:
        name: phr
        owner: phr
        state: present
      become_user: postgres

    - name: Ensure replication role exists
      community.postgresql.postgresql_user:
        name: replicator
        password: "{{ postgres_replication_password }}"
        role_attr_flags: LOGIN,REPLICATION
        state: present
        no_password_changes: true
      become_user: postgres
      no_log: true

  handlers:
    - name: Reload PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: reloaded

- name: Configure PostgreSQL standby
  hosts: db_standby
  become: true

  vars:
    ansible_ssh_pipelining: true
    postgresql_data_dir: "/var/lib/postgresql/16/main"
    primary_host: "db-02.ru-central1.internal"

  tasks:
    - name: Check standby signal
      ansible.builtin.stat:
        path: "{{ postgresql_data_dir }}/standby.signal"
      register: standby_signal

    - name: Stop PostgreSQL before initial standby creation
      ansible.builtin.service:
        name: postgresql
        state: stopped
      when: not standby_signal.stat.exists

    - name: Remove default PostgreSQL data directory before base backup
      ansible.builtin.file:
        path: "{{ postgresql_data_dir }}"
        state: absent
      when: not standby_signal.stat.exists

    - name: Recreate PostgreSQL data directory
      ansible.builtin.file:
        path: "{{ postgresql_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"
      when: not standby_signal.stat.exists

    - name: Create PostgreSQL password file for replication
      ansible.builtin.copy:
        dest: /var/lib/postgresql/.pgpass
        owner: postgres
        group: postgres
        mode: "0600"
        content: |
          {{ primary_host }}:5432:*:replicator:{{ postgres_replication_password }}
      no_log: true

    - name: Initialize standby from primary
      ansible.builtin.command:
        cmd: >
          pg_basebackup
          -h {{ primary_host }}
          -p 5432
          -U replicator
          -D {{ postgresql_data_dir }}
          -Fp
          -Xs
          -P
          -R
      become_user: postgres
      environment:
        PGPASSFILE: /var/lib/postgresql/.pgpass
      when: not standby_signal.stat.exists
      no_log: true

    - name: Ensure PostgreSQL standby is running
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true
