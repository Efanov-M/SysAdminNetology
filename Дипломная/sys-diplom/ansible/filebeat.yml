---
- name: Install and configure Filebeat
  hosts: web
  become: true

  tasks:
    - name: Remove unavailable Elastic APT repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/elastic-9.x.list
        state: absent

    - name: Download Filebeat package on control node
      ansible.builtin.command:
        cmd: >
          curl -fL
          https://artifacts.elastic.co/downloads/beats/filebeat/filebeat-9.5.3-amd64.deb
          -o /tmp/filebeat-9.5.3-amd64.deb
        creates: /tmp/filebeat-9.5.3-amd64.deb
      delegate_to: localhost
      run_once: true
      become: false

    - name: Copy Filebeat package to web servers
      ansible.builtin.copy:
        src: /tmp/filebeat-9.5.3-amd64.deb
        dest: /tmp/filebeat-9.5.3-amd64.deb
        mode: "0644"

    - name: Install Filebeat 9.5.3
      ansible.builtin.apt:
        deb: /tmp/filebeat-9.5.3-amd64.deb
        state: present

    - name: Configure Filebeat output
      ansible.builtin.copy:
        dest: /etc/filebeat/filebeat.yml
        owner: root
        group: root
        mode: "0600"
        content: |
          filebeat.config.modules:
            path: ${path.config}/modules.d/*.yml
            reload.enabled: false

          output.elasticsearch:
            hosts:
              - "http://elasticsearch.ru-central1.internal:9200"

          logging.level: info
          logging.to_files: true
          logging.files:
            path: /var/log/filebeat
            name: filebeat
            keepfiles: 7
            permissions: 0640
      notify: Restart Filebeat

    - name: Configure nginx module
      ansible.builtin.copy:
        dest: /etc/filebeat/modules.d/nginx.yml
        owner: root
        group: root
        mode: "0644"
        content: |
          - module: nginx
            access:
              enabled: true
              var.paths:
                - /var/log/nginx/access.log*

            error:
              enabled: true
              var.paths:
                - /var/log/nginx/error.log*
      notify: Restart Filebeat

    - name: Test Filebeat configuration
      ansible.builtin.command:
        cmd: filebeat test config -e
      changed_when: false

    - name: Test Elasticsearch connection
      ansible.builtin.command:
        cmd: filebeat test output -e
      changed_when: false

    - name: Ensure Filebeat is enabled and running
      ansible.builtin.service:
        name: filebeat
        state: started
        enabled: true

  handlers:
    - name: Restart Filebeat
      ansible.builtin.service:
        name: filebeat
        state: restarted
